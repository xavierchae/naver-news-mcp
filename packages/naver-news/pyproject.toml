[project]
name = "naver-news"
version = "0.1.0"
description = "네이버 검색 API 기반 뉴스 검색·본문 조회 클라이언트"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "pydantic>=2.7", "selectolax>=0.3.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/naver_news"]
