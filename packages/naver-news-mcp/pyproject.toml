[project]
name = "naver-news-mcp"
version = "0.1.0"
description = "네이버 뉴스 검색·본문 조회 MCP 서버"
requires-python = ">=3.11"
dependencies = ["mcp>=1.10", "pydantic-settings>=2.3", "naver-news"]

[project.scripts]
naver-news-mcp = "naver_news_mcp.server:main"

[tool.uv.sources]
naver-news = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/naver_news_mcp"]
